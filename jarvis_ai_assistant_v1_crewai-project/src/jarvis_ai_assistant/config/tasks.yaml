---
analyze_request:
  description: Analyze the user's request about {topic} and determine what type of
    assistance is needed. Identify if this requires research, communication, scheduling,
    data analysis, or any combination of services. Create a comprehensive action plan.
  expected_output: 'A detailed analysis of the user''s request including: 1) Type
    of assistance needed, 2) Key information required, 3) Recommended approach, and
    4) Action plan with prioritized steps to fulfill the request.'
  agent: personal_ai_assistant
conduct_research:
  description: Based on the analysis from the Personal AI Assistant, conduct comprehensive
    research on {topic}. Gather relevant information, data, and insights from available
    sources. Focus on providing accurate, up-to-date, and actionable information.
  expected_output: 'A comprehensive research report including: 1) Key findings and
    insights about {topic}, 2) Relevant data and statistics, 3) Current trends and
    developments, 4) Sources and references, and 5) Actionable recommendations.'
  agent: research_analyst
  context:
  - analyze_request
manage_communications:
  description: Based on the analysis and research findings, manage any communication-related
    tasks for {topic}. This includes drafting messages, organizing information for
    sharing, and ensuring all communication needs are addressed professionally and
    efficiently.
  expected_output: 'A communication management report including: 1) Communication
    strategy for {topic}, 2) Drafted messages or content if needed, 3) Recommendations
    for optimal communication channels, and 4) Follow-up action items for communications.'
  agent: communication_manager
  context:
  - analyze_request
  - conduct_research
send_morning_briefing:
  description: "Send the generated morning briefing to {user_name} via email. Use
    a clear subject line like \"\U0001F305 Your Daily Briefing - [Date]\" and ensure
    the content is properly formatted with HTML for better readability. Include a
    professional signature from Jarvis AI Assistant."
  expected_output: Successfully sent morning briefing email to {user_name} with confirmation
    of delivery. The email should have an engaging subject line, well-formatted HTML
    content, and professional presentation.
  agent: notification_sender
  context:
  - generate_morning_briefing
manage_communications:
  description: Based on the analysis and research findings, manage any communication-related
    tasks for {topic}. This includes drafting messages, organizing information for
    sharing, and ensuring all communication needs are addressed professionally and
    efficiently.
  expected_output: 'A communication management report including: 1) Communication
    strategy for {topic}, 2) Drafted messages or content if needed, 3) Recommendations
    for optimal communication channels, and 4) Follow-up action items for communications.'
  agent: communication_manager
  context:
  - analyze_request
  - conduct_research
google_workspace_integration:
  description: Handle all Google Workspace operations for {topic} including email
    management, calendar scheduling, document creation, and file organization. Coordinate
    with other agents to provide comprehensive Google services integration.
  expected_output: 'A comprehensive report of Google Workspace actions taken including:
    1) Email operations performed, 2) Calendar events managed, 3) Documents created
    or modified, 4) Files organized, and 5) Integration status and recommendations
    for enhanced productivity.'
  agent: google_workspace_manager
  context:
  - analyze_request
  - conduct_research
  - manage_communications
  - send_morning_briefing
